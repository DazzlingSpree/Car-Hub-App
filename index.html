

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Car Hub">
  <title>Car Hub PWA v1.0</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #141d2e;
      --card-active: #1e293b;
      --accent: #38bdf8;
      --border: #223049;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --green: #34d399;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: env(safe-area-inset-top, 20px) 18px env(safe-area-inset-bottom, 20px);
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      user-select: none;
    }
    .header { width: 100%; max-width: 500px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; padding: 0 4px; }
    .title { font-size: 19px; font-weight: 800; letter-spacing: 0.8px; color: var(--accent); margin: 0; }
    .badge { background: #1e293b; color: #94a3b8; font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 20px; border: 1px solid var(--border); }
    .vehicle-card { width: 100%; max-width: 500px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
    .v-details { display: flex; flex-direction: column; }
    .v-label { font-size: 11px; text-transform: uppercase; color: var(--text-muted); font-weight: 700; }
    .v-name { font-size: 20px; font-weight: 800; color: #fff; margin-top: 3px; }
    .v-status { font-size: 12px; color: var(--green); display: flex; align-items: center; gap: 6px; margin-top: 5px; }
    .v-dot { width: 7px; height: 7px; background: var(--green); border-radius: 50%; display: inline-block; }
    .switch-btn { background: #1e293b; border: 1px solid #334155; color: var(--accent); padding: 9px 15px; border-radius: 12px; font-size: 13px; font-weight: 700; cursor: pointer; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; width: 100%; max-width: 500px; flex-grow: 1; }
    .app-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; padding: 20px 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-decoration: none; color: var(--text); font-size: 15px; font-weight: 600; box-shadow: 0 4px 14px rgba(0,0,0,0.3); }
    .app-card:active { transform: scale(0.96); background: var(--card-active); }
    .icon { font-size: 34px; margin-bottom: 8px; }
    .card-hint { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(12px); align-items: center; justify-content: center; padding: 20px; z-index: 200; }
    .modal-box { background: #131b2e; border: 1px solid var(--border); width: 100%; max-width: 420px; border-radius: 24px; padding: 24px; }
    .modal-box h3 { margin: 0 0 16px 0; font-size: 19px; color: #fff; }
    .vehicle-list { display: flex; flex-direction: column; gap: 10px; max-height: 240px; overflow-y: auto; }
    .v-option { padding: 13px 16px; background: #0b0f19; border: 1px solid var(--border); border-radius: 14px; cursor: pointer; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
    .v-option.active { border-color: var(--accent); color: var(--accent); }
    .add-input { width: 100%; padding: 13px; border-radius: 12px; border: 1px solid #334155; background: #0b0f19; color: #fff; margin-top: 14px; font-size: 14px; outline: none; }
    .close-btn { width: 100%; margin-top: 14px; padding: 13px; border-radius: 14px; border: none; background: #334155; color: #fff; font-weight: 700; font-size: 15px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="header">
    <h1 class="title">CAR HUB</h1>
    <span class="badge">OFFLINE READY</span>
  </div>

  <div class="vehicle-card">
    <div class="v-details">
      <span class="v-label">Vehicle Connected</span>
      <span class="v-name" id="currentVehicleName">Detecting...</span>
      <span class="v-status"><span class="v-dot"></span><span id="syncState">Auto-Synchronized</span></span>
    </div>
    <button class="switch-btn" onclick="openVehicleModal()">Switch</button>
  </div>

  <div class="grid">
    <a href="youtube://" class="app-card"><span class="icon">▶️</span>YouTube<span class="card-hint">Online / Hotspot</span></a>
    <a href="music://" class="app-card"><span class="icon">🎵</span>Music<span class="card-hint">Offline Tracks</span></a>
    <a href="maps://" class="app-card"><span class="icon">🗺️</span>Apple Maps<span class="card-hint">Offline Maps</span></a>
    <a href="comgooglemaps://" class="app-card"><span class="icon">📍</span>Google Maps<span class="card-hint">Navigation</span></a>
    <a href="waze://" class="app-card"><span class="icon">🚗</span>Waze<span class="card-hint">Live Alerts</span></a>
    <a href="podcasts://" class="app-card"><span class="icon">🎙️</span>Podcasts<span class="card-hint">Saved Shows</span></a>
    <a href="shortcuts://run-shortcut?name=Car%20Connect" class="app-card"><span class="icon">⚡</span>Car Sync<span class="card-hint">Run Automation</span></a>
    <a href="App-Prefs:root=Bluetooth" class="app-card"><span class="icon">📶</span>Bluetooth<span class="card-hint">Car Settings</span></a>
  </div>

  <div class="modal" id="vehicleModal">
    <div class="modal-box">
      <h3>Select Vehicle Profile</h3>
      <div class="vehicle-list" id="vehicleList"></div>
      <input type="text" id="newVehicleInput" class="add-input" placeholder="Add custom vehicle (e.g. BMW M4)...">
      <button class="switch-btn" style="width:100%;margin-top:10px;padding:12px;" onclick="addNewVehicle()">+ Add Vehicle Profile</button>
      <button class="close-btn" onclick="closeVehicleModal()">Done</button>
    </div>
  </div>

  <script>
    const DEFAULT_VEHICLES = ["Tesla Model 3", "Porsche Taycan", "BMW M3", "Ford F-150", "Universal Vehicle"];

    function getVehicles() {
      try {
        const saved = localStorage.getItem("car_hub_vehicles");
        return saved ? JSON.parse(saved) : DEFAULT_VEHICLES;
      } catch(e) { return DEFAULT_VEHICLES; }
    }

    function saveVehicles(list) { localStorage.setItem("car_hub_vehicles", JSON.stringify(list)); }

    function initVehicle() {
      const urlParams = new URLSearchParams(window.location.search);
      const passedCar = urlParams.get("vehicle");
      if (passedCar && passedCar.trim() !== "") {
        const cleanName = decodeURIComponent(passedCar.trim());
        localStorage.setItem("car_hub_current_vehicle", cleanName);
        let list = getVehicles();
        if (!list.includes(cleanName)) { list.unshift(cleanName); saveVehicles(list); }
      }
      const activeCar = localStorage.getItem("car_hub_current_vehicle") || getVehicles()[0];
      document.getElementById("currentVehicleName").innerText = activeCar;
    }

    function openVehicleModal() {
      const list = getVehicles();
      const current = localStorage.getItem("car_hub_current_vehicle") || list[0];
      const container = document.getElementById("vehicleList");
      container.innerHTML = "";
      list.forEach(v => {
        const item = document.createElement("div");
        item.className = `v-option ${v === current ? 'active' : ''}`;
        item.innerHTML = `<span>${v}</span>${v === current ? '<span style="color:var(--accent);">✓</span>' : ''}`;
        item.onclick = () => selectVehicle(v);
        container.appendChild(item);
      });
      document.getElementById("vehicleModal").style.display = "flex";
    }

    function selectVehicle(name) {
      localStorage.setItem("car_hub_current_vehicle", name);
      document.getElementById("currentVehicleName").innerText = name;
      closeVehicleModal();
    }

    function addNewVehicle() {
      const input = document.getElementById("newVehicleInput");
      const name = input.value.trim();
      if (!name) return;
      let list = getVehicles();
      if (!list.includes(name)) { list.push(name); saveVehicles(list); }
      input.value = "";
      selectVehicle(name);
    }

    function closeVehicleModal() { document.getElementById("vehicleModal").style.display = "none"; }
    window.onload = initVehicle;
  </script>
</body>
</html>
