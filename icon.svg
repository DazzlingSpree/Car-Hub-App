<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#260006"/>
      <stop offset="60%" stop-color="#08080c"/>
      <stop offset="100%" stop-color="#020204"/>
    </radialGradient>

    <!-- Neon Crimson Linear Gradient -->
    <linearGradient id="neonRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#ff1a35"/>
      <stop offset="100%" stop-color="#8a0012"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="crimsonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" stroke="#ff1a35" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Subtle Cyber Matrix Grid Background -->
  <path d="M60 256 H452 M256 60 V452" stroke="#ff1a35" stroke-width="1.5" stroke-opacity="0.15" stroke-dasharray="8 6"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#ff1a35" stroke-width="1.5" stroke-opacity="0.12"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08"/>

  <!-- Glowing Outer HUD Ring -->
  <circle cx="256" cy="256" r="120" fill="none" stroke="#ff1a35" stroke-width="3" stroke-dasharray="140 25 40 25" filter="url(#crimsonGlow)"/>

  <!-- Mysthood Geometric Emblem -->
  <g filter="url(#crimsonGlow)">
    <!-- Top Apex Core -->
    <path d="M256 90 L370 290 H310 L256 195 L202 290 H142 Z" fill="url(#neonRed)"/>
    
    <!-- Inverted Cyber Wing Accents -->
    <path d="M256 420 L180 320 H220 L256 370 L292 320 H332 Z" fill="#ff1a35"/>
    
    <!-- Central HUD Core Dot -->
    <circle cx="256" cy="256" r="14" fill="#ffffff" filter="url(#crimsonGlow)"/>
  </g>

  <!-- Cockpit Crosshair Notches -->
  <path d="M256 100 V125 M256 387 V412 M100 256 H125 M387 256 H412" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.8"/>
</svg>
