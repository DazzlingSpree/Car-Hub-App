<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Solid Flat Background (No transparency, no rounded corners) -->
    <radialGradient id="spaceGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#140205"/>
      <stop offset="55%" stop-color="#07070a"/>
      <stop offset="100%" stop-color="#020204"/>
    </radialGradient>

    <!-- Neon Red Linear Gradient -->
    <linearGradient id="apexRed" x1="50%" y1="15%" x2="50%" y2="85%">
      <stop offset="0%" stop-color="#ff2e4d"/>
      <stop offset="50%" stop-color="#ff1236"/>
      <stop offset="100%" stop-color="#a80017"/>
    </linearGradient>

    <!-- Crimson Glow Filter -->
    <filter id="radarGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Edge-to-Edge Solid Canvas: Prevents iOS White Edges -->
  <rect width="512" height="512" fill="url(#spaceGrad)"/>

  <!-- Ambient Background Ring -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="#ff1236" stroke-width="1.5" stroke-opacity="0.12"/>
  <circle cx="256" cy="256" r="165" fill="none" stroke="#ff1236" stroke-width="2" stroke-opacity="0.22" stroke-dasharray="8 6"/>

  <!-- Glowing Radar Reticle Circle -->
  <circle cx="256" cy="256" r="126" fill="none" stroke="#ff1a38" stroke-width="4.5" stroke-dasharray="145 32 45 32" filter="url(#radarGlow)"/>

  <!-- Tactical Reticle Crosshairs -->
  <line x1="95" y1="256" x2="135" y2="256" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-opacity="0.9"/>
  <line x1="377" y1="256" x2="417" y2="256" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-opacity="0.9"/>
  <line x1="256" y1="95" x2="256" y2="125" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-opacity="0.8"/>
  <line x1="256" y1="387" x2="256" y2="417" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-opacity="0.8"/>

  <!-- Central Apex Emblem (Top Chevron) -->
  <g filter="url(#radarGlow)">
    <path d="M256 88 L374 290 H304 L256 204 L208 290 H138 Z" fill="url(#apexRed)"/>
    
    <!-- Lower Inverted Wing Chevron -->
    <path d="M256 424 L174 316 H236 L256 348 L276 316 H338 Z" fill="url(#apexRed)"/>
  </g>

  <!-- Glowing White Core Sensor -->
  <circle cx="256" cy="256" r="24" fill="#ff1236" filter="url(#radarGlow)" opacity="0.6"/>
  <circle cx="256" cy="256" r="17" fill="#ffffff" filter="url(#radarGlow)"/>
</svg>
